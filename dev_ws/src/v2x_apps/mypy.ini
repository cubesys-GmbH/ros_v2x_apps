# Type-check config for the v2x_apps package. Enforced in CI (.github/workflows/ci.yml)
# and runnable locally with `mypy .` from this directory.
[mypy]
python_version = 3.12
exclude = (?x)(^test/)

# rclpy and the ETSI / cube message packages ship no type stubs and are only
# importable from a built ROS workspace, so treat them as Any rather than error.
ignore_missing_imports = True

# Check our own logic even inside otherwise-untyped function bodies.
check_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
