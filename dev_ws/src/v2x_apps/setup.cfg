[develop]
script_dir=$base/lib/v2x_apps
[install]
install_scripts=$base/lib/v2x_apps

[flake8]
max-line-length = 99
extend-ignore = W503,W504
import-order-style = google
application-import-names = c2c,v2x_apps

[pydocstyle]
convention = pep257
add-ignore = D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D213

[tool:pytest]
filterwarnings =
    ignore:.*fork\(\) may lead to deadlocks.*:DeprecationWarning
